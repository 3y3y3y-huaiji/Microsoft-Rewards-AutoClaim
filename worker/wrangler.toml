name = "rewards-promo"
main = "src/index.ts"
compatibility_date = "2024-08-01"

[observability]
enabled = false

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

# 绑定后通过 https://rewards-promo.<你的子域>.workers.dev 访问
# 后续在 Cloudflare Dashboard 绑定自定义域名如 promo.你的域名.com
