<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    Original icon for "Microsoft Automatic Rewards".
    Deliberately contains NO Microsoft trademarks: no four-square design mark,
    no Microsoft color arrangement, no Microsoft logotype. Motif: a reward coin
    with a star, on a teal/emerald gradient. Source of truth — regenerate the
    PNGs with `node scripts/build-icons.mjs`.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="0.55" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- reward coin -->
  <circle cx="256" cy="264" r="150" fill="url(#coin)" stroke="#D97706" stroke-width="14"/>
  <circle cx="256" cy="264" r="118" fill="none" stroke="#FCD34D" stroke-width="8" opacity="0.85"/>

  <!-- five-point star -->
  <path d="M256 190 L273.63 239.73 L326.38 241.13 L284.53 273.27 L299.50 323.87 L256 294 L212.50 323.87 L227.47 273.27 L185.62 241.13 L238.37 239.73 Z" fill="#FFFFFF"/>

  <!-- sparkles -->
  <g fill="#FFFFFF" opacity="0.9">
    <path d="M120 118 l11 28 28 11 -28 11 -11 28 -11 -28 -28 -11 28 -11 z"/>
    <path d="M404 352 l8 21 21 8 -21 8 -8 21 -8 -21 -21 -8 21 -8 z"/>
  </g>
</svg>
